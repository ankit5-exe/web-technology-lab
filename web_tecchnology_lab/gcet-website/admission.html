<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admission Form - GCET Jammu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a class="brand" href="index.html">
    <img src="images/logo.jpg" alt="GCET Jammu logo">
    <h1>Government College of Engineering &amp; Technology, Jammu</h1>
  </a>
  <p>Welcome to our College</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="faculty.html">Faculty</a>
    <a href="students.html">Students</a>
    <a href="gallery.html">Photo Gallery</a>
    <a href="admission.html" class="active">Admission Form</a>
    <a href="signin.html">Sign In</a>
</nav>

<div class="container">

  <h2>Student Admission Form</h2>
  <form action="submit.html" method="get">

    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="dob">Date of Birth</label>
    <input type="date" id="dob" name="dob" required>

    <label for="mobile">Mobile Number</label>
    <input type="tel" id="mobile" name="mobile" required>

    <fieldset>
      <legend>Gender</legend>
      <label><input type="radio" name="gender" value="male" required> Male</label>
      <label><input type="radio" name="gender" value="female"> Female</label>
      <label><input type="radio" name="gender" value="other"> Other</label>
    </fieldset>

    <label for="course">Course</label>
    <select id="course" name="course" required>
      <option value="">Select Course</option>
      <option value="cse">Computer Science</option>
      <option value="it">Information Technology</option>
      <option value="ee">Electrical Engineering</option>
      <option value="ece">Electronics &amp; Communication</option>
      <option value="me">Mechanical Engineering</option>
      <option value="ce">Civil Engineering</option>
    </select>

    <fieldset>
      <legend>Hobbies</legend>
      <label><input type="checkbox" name="hobbies" value="sports"> Sports</label>
      <label><input type="checkbox" name="hobbies" value="music"> Music</label>
      <label><input type="checkbox" name="hobbies" value="reading"> Reading</label>
      <label><input type="checkbox" name="hobbies" value="coding"> Coding</label>
    </fieldset>

    <label for="address">Address</label>
    <textarea id="address" name="address" rows="4" required></textarea>

    <button type="submit">Submit</button>
    <button type="reset" class="reset">Reset</button>
  </form>

</div>

<footer>
  <p>Government College of Engineering &amp; Technology, Jammu</p>
  <p>Email: college@gmail.com | Phone: 9876543210</p>
</footer>

</body>
</html>
