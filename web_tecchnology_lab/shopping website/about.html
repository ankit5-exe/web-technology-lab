<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEase - Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo">Shop<span>Ease</span></a>
    <form class="search-bar" onsubmit="return false;">
      <input type="text" id="searchInput" placeholder="Search for products, brands and more">
      <button type="button" id="searchBtn">Search</button>
    </form>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="cart.html" class="cart-link active">Cart <span id="cartCount" class="badge">0</span></a>
    </nav>
  </header>

  <main class="container">
    <h2 class="section-title">Your Shopping Cart</h2>
    <div class="cart-layout">
      <div class="cart-items" id="cartItems"></div>
      <aside class="summary" id="summary">
        <h3>Order Summary</h3>
        <div class="row"><span>Subtotal</span><span id="subtotal">Rs. 0</span></div>
        <div class="row"><span>Delivery</span><span id="delivery">Rs. 0</span></div>
        <div class="row"><span>Discount</span><span id="discount">- Rs. 0</span></div>
        <div class="row total"><span>Total</span><span id="total">Rs. 0</span></div>
        <div class="coupon">
          <input type="text" id="couponInput" placeholder="Coupon code (try SAVE10)">
          <button id="applyCoupon">Apply</button>
        </div>
        <button class="btn full" id="checkoutBtn">Proceed to Checkout</button>
        <button class="btn-outline full" id="clearCart">Clear Cart</button>
      </aside>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 ShopEase. All rights reserved.</p>
  </footer>

  <div id="toast" class="toast"></div>
  <script src="script.js"></script>
</body>
</html>
