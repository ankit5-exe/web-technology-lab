<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEase - Products</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo">Shop<span>Ease</span></a>
    <form class="search-bar" onsubmit="return false;">
      <input type="text" id="searchInput" placeholder="Search for products, brands and more">
      <button type="button" id="searchBtn">Search</button>
    </form>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html" class="active">Products</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="cart.html" class="cart-link">Cart <span id="cartCount" class="badge">0</span></a>
    </nav>
  </header>

  <main class="container">
    <h2 class="section-title">All Products</h2>
    <div class="filters">
      <div class="filter-btns" id="filterBtns">
        <button class="filter active" data-cat="All">All</button>
        <button class="filter" data-cat="Electronics">Electronics</button>
        <button class="filter" data-cat="Fashion">Fashion</button>
        <button class="filter" data-cat="Home">Home</button>
        <button class="filter" data-cat="Beauty">Beauty</button>
      </div>
      <select id="sortSelect">
        <option value="default">Sort by: Featured</option>
        <option value="low">Price: Low to High</option>
        <option value="high">Price: High to Low</option>
        <option value="rating">Top Rated</option>
      </select>
    </div>
    <div class="product-grid" id="productGrid"></div>
    <p id="noResults" class="no-results" hidden>No products found. Try a different search.</p>
  </main>

  <footer class="footer">
    <p>&copy; 2026 ShopEase. All rights reserved.</p>
  </footer>

  <div id="toast" class="toast"></div>
  <script src="script.js"></script>
</body>
</html>
